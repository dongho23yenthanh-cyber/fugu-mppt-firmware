adc=vconv
expected_hz=2500
power_conversion_eff=0.97

# Channel mapping is fixed in ADC_VConv: 0=Vin, 1=Vout, 2=Iout, 4=NTC.
# Iin is omitted -> setupSensors uses a VirtualSensor (Iout·Vout / Vin / eff).

vin_ch=0
vin_rh=0       # identity LinearTransform (ADC_VConv returns physical V)
vin_rl=1
vin_filt_len=3

vout_ch=1
vout_rh=0
vout_rl=1
vout_filt_len=3

iout_ch=2
iout_factor=1.0
iout_midpoint=0.0
iout_filt_len=3

ntc_ch=4
ntc_filt_len=60

iin_filt_len=3
