# PV source: 8A, 40V, MPP at ~32V (k=0.8). MPP power ~200W.
isc=13.0
voc=76.0
pv_k=0.85

# Battery sink: 28V (8-cell LFP pack), small series R for stiffness.
v_bat=27.0
r_bat=0.05

# Mains-rectified ripple on V_bat. Default off; enable to stress the vout notch.
vbat_ac_amp=0.0
vbat_ac_freq=100

# Passives. L comes from coil.conf::L0 (50 µH for wokwi_mock-derived defaults).
c_in=470e-6
c_out=470e-6

# Sampling tick (also the cycle-step granularity).
adc_freq=3000

# Per-channel zero-mean Gaussian ADC noise σ (physical units). 0 = deterministic.
noise_vin=0.0
noise_iin=0.0
noise_iout=0.0
noise_vout=0.0
noise_ntc=0.0
