# BleConsoleService: NUS serial console over BLE (works without WiFi). Only present in WITH_BLE
# firmware builds. Toggle at runtime with `service start ble` / `service stop ble`.
enabled=1
log_level=info
# ble_security: none | justworks | passkey   (justworks = encrypted, no passkey; good for Web Bluetooth)
ble_security=justworks
# ble_passkey is only used when ble_security=passkey (6 digits)
# ble_passkey=123456
