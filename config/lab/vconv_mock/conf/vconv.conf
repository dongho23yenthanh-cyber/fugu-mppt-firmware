# PV source: Isc 13A, Voc 76V, k=V_mpp/Voc=0.85 -> MPP ~65V, ~790W (steep knee).
isc=13.0
voc=76.0
pv_k=0.85

# Battery sink: 28V (8-cell LFP pack), small series R for stiffness.
# Open-circuit output preset: v_bat=0, r_bat=1e9 (or `vconv bat open` at runtime).
v_bat=27.0
r_bat=0.05

# Inverter ripple on V_bat. Default off; enable to stress the vout notch.
# Modelled from the fry 2 kW-inverter capture (etc/scope_client/fry/2000w-inverter-midday-...):
# a near-pure SINE at 2x line, ~0.6% RMS of V_bat (measured 2nd harmonic <1%) — an inverter draws
# cos(2*line) reactive power so the bus ripple is sinusoidal, NOT |sin|. For that fry profile set
# vbat_ac_amp=0.26 (peak V; 0.26 on ~28 V ≈ 0.6% RMS), vbat_ac_freq=100.
# vbat_ac_shape: 0 = sine (inverter), 1 = full-wave |sin| (rectifier load, ~20% 2nd harmonic).
vbat_ac_amp=0.0
vbat_ac_freq=100
vbat_ac_shape=0

# Passives. L comes from coil.conf::L0 (50 µH for wokwi_mock-derived defaults).
c_in=470e-6
c_out=470e-6

# Sampling tick (also the cycle-step granularity).
adc_freq=3000

# Per-channel zero-mean Gaussian ADC noise σ (physical units). 0 = deterministic.
# For the fry inverter profile, noise_vout=0.03 models the ~0.12% RMS broadband residual (the ~20%
# of Vout AC beyond the 2x-line sine; partly INA226 measurement noise).
noise_vin=0.0
noise_iin=0.0
noise_iout=0.0
noise_vout=0.0
noise_ntc=0.0
